# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "cttadmin"

[api]
enabled = true
port = 54321
# `audit` is exposed so administrators can query the immutable log through PostgREST
# (supabase-js: `client.schema('audit')`). Access is still gated by RLS: admin-only SELECT.
schemas = ["public", "audit", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email testing inbox (no mail leaves the machine).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4200"
additional_redirect_urls = ["http://127.0.0.1:4200"]
# Short-lived access tokens with automatic refresh (research R-005).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Internal collaborators are provisioned by an administrator, never self-registered;
# the public agency onboarding flow creates its admin through the Admin API instead.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
# NOTE: this must stay true or GoTrue disables the whole email provider
# (GOTRUE_EXTERNAL_EMAIL_ENABLED=false → "email_provider_disabled" on login).
# Public self-registration is still blocked globally by [auth] enable_signup = false
# (GOTRUE_DISABLE_SIGNUP=true); collaborators are provisioned by an administrator.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# Injects `organization_id` and `app_role` into every access token (migration 006).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# Enforces per-account lockout and rejects deactivated accounts AFTER verifying the
# password (migration 008, ADR-0003). Required for quickstart scenario 6.
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/password_verification_hook"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Public onboarding endpoint: callable without a session (US5).
[functions.register-agency]
verify_jwt = false

# Webhook de Meta; la autorización es la firma X-Hub-Signature-256 verificada en la función.
[functions.whatsapp-inbound]
verify_jwt = false
